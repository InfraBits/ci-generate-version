name: Generate a version identifier from the latest git commit

on:
  workflow_call:
    inputs:
      prefix:
        type: string
        required: false
        default: ""
        description: Prefix to pre-pend to the generated version

    outputs:
      version:
        description: Version
        value: ${{ jobs.generate-version.outputs.version }}

jobs:
  generate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: generate version
        id: version
        env:
          PREFIX: ${{ inputs.prefix }}
        run: |
          version="v$(git show -s --format=%ct)"
          echo "version=${PREFIX}${version}" >> $GITHUB_OUTPUT
